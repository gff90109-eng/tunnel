<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="势垒实验台">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000">
<title>势垒实验台</title>
<style>:root {
  --blue: #3B82F6; --green: #38E0C4; --gold: #FFD84D; --egreen: #5CE07A;
  --ink: rgba(255,255,255,.86); --dim: rgba(255,255,255,.46); --faint: rgba(255,255,255,.13); --hair: rgba(255,255,255,.07);
  --math: "QT Math", "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --u: clamp(11px, 1.35vh, 15px);
  /* 全页统一的动效：一条缓动曲线、两个时长 */
  --ease: cubic-bezier(.22,.7,.18,1);
  --t1: .26s; --t2: .42s;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--zh); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; position: relative; transition: color var(--t1) var(--ease), background-color var(--t1) var(--ease), border-color var(--t1) var(--ease), opacity var(--t1) var(--ease), box-shadow var(--t1) var(--ease), transform var(--t1) var(--ease), filter var(--t1) var(--ease); }
i { font-family: var(--math); font-style: italic; }
svg { width: 1.45em; height: 1.45em; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }

#app { display: grid; height: 100vh; width: 100vw; grid-template-rows: auto minmax(0, 1fr) auto; }
.grp { display: flex; align-items: center; gap: .35em; position: relative; }

/* 顶栏 */
#top { display: flex; align-items: center; gap: 1.4em; padding: .45em 1.1em; font-size: var(--u); }
.ic { width: 2.4em; height: 2.4em; display: grid; place-items: center; border-radius: 50%; color: rgba(255,255,255,.58); z-index: 1; }
.ic:hover { color: #fff; }
.ic.on { color: #fff; }
#toolPill { position: absolute; left: 0; top: 50%; width: 2.4em; height: 2.4em; margin-top: -1.2em; border-radius: 50%; background: rgba(255,255,255,.09); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 0 14px rgba(150,190,255,.12); transition: transform var(--t2) var(--ease); pointer-events: none; }
.vsep { width: 1px; height: 1.4em; background: var(--faint); margin: 0 .4em; }
#presets { display: flex; gap: .15em; justify-content: center; min-width: 0; flex: 1; position: relative; }
.preset { padding: .4em .5em; border-radius: 6px; }
.preset canvas { display: block; opacity: .5; transition: opacity var(--t1) var(--ease), transform var(--t1) var(--ease); }
.preset:hover canvas { opacity: .9; transform: translateY(-1px); }
.preset.on canvas { opacity: 1; }
#presetMark { position: absolute; left: 0; bottom: .1em; height: 1px; width: 20px; background: var(--gold); box-shadow: 0 0 6px rgba(255,216,77,.6); transition: transform var(--t2) var(--ease), width var(--t2) var(--ease), opacity var(--t1) var(--ease); pointer-events: none; }
#particles { margin-left: auto; }
/* 粒子的轻重：名字前一颗点，越重越大（面积按质量的对数） */
.seg button .dot { display: inline-block; width: var(--d); height: var(--d); border-radius: 50%; background: currentColor; margin-right: .5em; vertical-align: middle; position: relative; top: -.08em; box-shadow: 0 0 6px rgba(150,190,255,.35); transition: transform .42s var(--ease); }
.seg button.on .dot { transform: scale(1.12); }
#run { gap: .5em; margin-right: .2em; }
.seg { display: flex; border: 1px solid var(--faint); border-radius: 999px; padding: 2px; position: relative; }
.seg button { padding: .3em .95em; border-radius: 999px; color: var(--dim); letter-spacing: .08em; z-index: 1; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: #fff; }
.seg button.off { opacity: .32; cursor: default; }
#partPill { position: absolute; left: 0; top: 2px; bottom: 2px; width: 3em; border-radius: 999px; background: rgba(255,255,255,.1); transition: transform var(--t2) var(--ease), width var(--t2) var(--ease); pointer-events: none; }
#massRuler { width: 150px; height: 14px; overflow: visible; }
#massRuler .rl { stroke: rgba(255,255,255,.2); stroke-width: 1; }
#massRuler .tk { stroke: rgba(255,255,255,.22); stroke-width: 1; }
#massRuler .pm { fill: rgba(255,255,255,.35); stroke: none; }
#massRuler .halo { fill: rgba(150,190,255,.25); stroke: none; }
#massRuler .core { fill: #fff; stroke: none; }
#massDot { transition: transform .6s var(--ease); }
.chip { border: 1px solid var(--faint); border-radius: 999px; padding: .26em .8em; color: var(--dim); font-size: 1em; white-space: nowrap; line-height: 1.35; }
.chip:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }
.chip.on { color: #fff; border-color: rgba(255,255,255,.45); background: rgba(255,255,255,.07); }
.chip i { font-size: 1.12em; }
.chip sup, .chip sub { font-size: .66em; line-height: 0; }
#allmark { width: 2.2em; height: 2.2em; display: grid; place-items: center; color: rgba(255,255,255,.45); border-radius: 50%; }
#allmark:hover, #allmark:active { color: #fff; }
#allmark svg { width: 1.3em; height: 1.3em; stroke-width: 1.2; }
#allmark .fill { fill: currentColor; stroke: none; }
/* 可指的东西：指针靠近时轻轻亮起（不加任何字） */
[data-ann] { filter: drop-shadow(0 0 0 rgba(160,200,255,0)); transition: filter var(--t1) var(--ease), color var(--t1) var(--ease), background-color var(--t1) var(--ease), border-color var(--t1) var(--ease), opacity var(--t1) var(--ease), box-shadow var(--t1) var(--ease), transform var(--t1) var(--ease); }
[data-ann]:hover { filter: drop-shadow(0 0 6px rgba(160,200,255,.35)); }

/* 主画布 */
#viewWrap { position: relative; min-height: 0; overflow: hidden; touch-action: none; }
#view { position: absolute; left: 0; top: 0; touch-action: none; cursor: crosshair; }
.read { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: .32em; font-size: var(--u); text-shadow: 0 0 10px #000, 0 0 3px #000; transition: opacity var(--t2) var(--ease); cursor: default; }
.read.hide { opacity: 0; pointer-events: none; }
.read .lab { font-size: 2.1em; }
.read .rel { font-family: var(--math); font-size: 1.85em; color: rgba(255,255,255,.7); width: .9em; text-align: center; }
.read .num { font-family: var(--math); font-size: 2.1em; font-variant-numeric: tabular-nums; transition: color var(--t2) var(--ease); }
.read .num .u { font-size: .78em; margin-left: .04em; }
.read .num .x { font-size: .7em; margin: 0 .06em; }
.read .num sup { font-size: .5em; }
/* v5：全页两种颜色——穿过去的绿、弹回来的蓝。读数、T(E) 横条、波的两股同色 */
#readT { color: #D0FFF6; }
#readT .lab { color: #6EEAD8; text-shadow: 0 0 12px rgba(56,224,196,.45), 0 0 10px #000; }
#readT .num { color: #DAFFF8; }
#readT.pre .num { color: rgba(170,240,228,.78); }
/* v6：拖能量线时读数底下一根很短的绿蓝比例条：绿的一段就是 T（随手出现，松手就走） */
#readT .mix { position: absolute; left: 1.55em; right: .2em; bottom: -.55em; height: 2px; border-radius: 1px; background: rgba(110,160,255,.7); opacity: 0; overflow: hidden; pointer-events: none; }
#readT .mix b { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #6EEAD8; box-shadow: 0 0 6px rgba(56,224,196,.6); transform-origin: 0 50%; transform: scaleX(0); }
#readR { color: #DDE8FF; }
#readR .lab { color: #8DB4FF; text-shadow: 0 0 12px rgba(80,140,255,.5), 0 0 10px #000; }
#readR .num { color: #DDE8FF; }
/* 相位颜色开关：一个色环，关着是暗的细环，开着亮成彩色 */
#phaseBtn .wheel { width: 1.15em; height: 1.15em; border-radius: 50%; display: block; position: relative;
  background: conic-gradient(from 90deg, #3B82F6, #3EE7A2, #FFD84D, #EBF0FF, #3B82F6);
  -webkit-mask: radial-gradient(circle, transparent 0 42%, #000 46%); mask: radial-gradient(circle, transparent 0 42%, #000 46%);
  opacity: .6; filter: saturate(.7); transition: opacity var(--t2) var(--ease), filter var(--t2) var(--ease), transform .6s var(--ease); }
#phaseBtn:hover .wheel { opacity: .7; }
#phaseBtn.on .wheel { opacity: 1; filter: saturate(1) drop-shadow(0 0 5px rgba(160,220,255,.55)); transform: rotate(180deg); }
/* 视角按钮：舞台右下角。正面时画的是立方体（点了转成三维），三维里画的是一个正面的方框（点了缓缓回正） */
#viewBtn { position: absolute; left: 0; top: 0; width: 2.6em; height: 2.6em; display: grid; place-items: center; border-radius: 50%; font-size: var(--u);
  color: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.35); z-index: 3; }
#viewBtn:hover { color: #fff; border-color: rgba(255,255,255,.4); }
#viewBtn svg { position: absolute; width: 1.45em; height: 1.45em; transition: opacity var(--t2) var(--ease), transform var(--t2) var(--ease); }
#viewBtn .flat { opacity: 0; transform: rotateY(60deg) scale(.8); }
#viewBtn.is3d { color: #fff; border-color: rgba(160,200,255,.55); box-shadow: 0 0 14px rgba(120,170,255,.25); }
#viewBtn.is3d .cube { opacity: 0; transform: scale(.8) rotate(-20deg); }
#viewBtn.is3d .flat { opacity: 1; transform: none; }
#toolPill { opacity: 1; }


/* 底栏 */
#bottom { display: flex; align-items: center; gap: 2.2em; padding: .5em 1.2em .6em; font-size: var(--u); border-top: 1px solid var(--hair); }
.primary, .round { width: 2.7em; height: 2.7em; display: grid; place-items: center; border-radius: 50%; }
.primary { border: 1px solid rgba(255,255,255,.55); color: #fff; background: rgba(59,130,246,.10); box-shadow: inset 0 0 14px rgba(59,130,246,.22); }
.primary:hover { background: rgba(59,130,246,.22); }
.primary svg { fill: currentColor; stroke: none; width: 1.25em; height: 1.25em; }
.primary svg path { transition: d var(--t1) var(--ease); }
.round { border: 1px solid var(--faint); color: var(--dim); }
.round:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }
.round svg { width: 1.2em; height: 1.2em; }
.sl { display: flex; align-items: center; gap: .7em; flex: 1; min-width: 0; max-width: 19em; }
.sl .m { font-size: 1.5em; width: .8em; text-align: center; color: var(--ink); }
#plotChips { margin-left: auto; gap: .4em; }
@property --reach { syntax: '<length-percentage>'; inherits: true; initial-value: 100%; }
input[type=range] { --reach: 100%; transition: --reach .3s var(--ease); -webkit-appearance: none; appearance: none; flex: 1; min-width: 4em; height: 22px; background: transparent; cursor: pointer; touch-action: none; }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.28) 0 var(--reach), rgba(255,255,255,.07) var(--reach) 100%); }
input[type=range]::-moz-range-track { height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.28) 0 var(--reach), rgba(255,255,255,.07) var(--reach) 100%); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #fff; margin-top: -5px; box-shadow: 0 0 0 3px rgba(255,255,255,.07), 0 0 8px rgba(150,190,255,.45); transition: transform .2s var(--ease); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.25); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 0; }

/* 解释：引线 + 落在线上的名字 + 线下一两句；没有框，只有一层很淡的暗晕保证在波形上也读得清 */
#leads { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 20; overflow: visible; }
#leads path { fill: none; stroke-width: 1; filter: drop-shadow(0 0 3px currentColor); }
#leads circle { filter: drop-shadow(0 0 4px rgba(255,255,255,.8)); }
#leads .allline { stroke-width: .9; opacity: .8; filter: none; }
/* 软件渲染降档后：引线、圆点不用 drop-shadow（软件合成里它很贵，全部标注开关时会卡） */
.slow #leads path, .slow #leads circle { filter: none; }
.slow [data-ann]:hover { filter: none; }
.ann { position: fixed; left: 0; top: 0; z-index: 21; pointer-events: none; max-width: min(21em, 42vw); font-size: clamp(14px, 1.75vh, 19px); opacity: 0; will-change: transform, opacity; }
.ann::before { content: ""; position: absolute; inset: -1.2em -1.4em; background: radial-gradient(closest-side, rgba(0,0,0,.82), rgba(0,0,0,.55) 60%, rgba(0,0,0,0)); z-index: -1; }
.ann .hd { display: flex; align-items: baseline; gap: .55em; padding: 0 .1em .3em; }
.ann .sym { font-family: var(--math); font-size: 1.55em; color: var(--c); text-shadow: 0 0 12px var(--c); line-height: 1; }
.ann .sym i { font-style: italic; }
.ann .sym sup, .ann .sym sub { font-size: .62em; }
.ann .nm { font-size: .92em; color: rgba(255,255,255,.62); letter-spacing: .06em; white-space: nowrap; }
.ann .tx { font-size: 1em; color: rgba(255,255,255,.93); line-height: 1.55; padding: .4em .1em 0; }
.ann:not(.up) .hd { padding-top: .45em; }
/* 卡片在锚点上方时：正文在上、名字在下站在引线上——引线从下方接到卡片底边，不会穿过正文 */
.ann.up { display: flex; flex-direction: column-reverse; }
/* 实在让不开墙和波时：给文字垫一层足够暗的底（G 审 v5 的 P2-04） */
.ann::before { transition: background var(--t2) var(--ease), inset var(--t2) var(--ease), border-radius var(--t2) var(--ease); }
.ann.solid::before { inset: -.55em -.75em; border-radius: 10px; background: rgba(4,6,10,.9); box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 6px 24px rgba(0,0,0,.6); }
.ann.up .tx { padding: 0 .1em .35em; }
.ann.up .hd { padding: .2em .1em .25em; }
/* 全部标注 */
.alllabels { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 19; opacity: 0; }
.lbl { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: .35em; font-size: clamp(12px, 1.4vh, 15px); padding: .05em .35em; white-space: nowrap; color: #fff; background: rgba(0,0,0,.62); border-bottom: 1px solid var(--c); }
.lbl .sym { font-family: var(--math); color: var(--c); font-size: 1.15em; }
.lbl .sym sup, .lbl .sym sub { font-size: .62em; }

/* 开场演示的指针 */
.ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; opacity: 0; }
.ghost i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 0 12px rgba(160,200,255,.7), inset 0 0 6px rgba(160,200,255,.5); }
.ghost i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
.ripple { position: fixed; left: 0; top: 0; z-index: 29; pointer-events: none; }
.ripple::before { content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); animation: rip .65s var(--ease) forwards; }
@keyframes rip { to { transform: scale(3.2); opacity: 0; } }
#filmCursor { display: none; position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; }
#filmCursor svg { width: 20px; height: 24px; fill: #fff; stroke: #000; stroke-width: 1.2; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

/* ───────── v8 ───────── */
/* 工具栏里的 f(x) */
#fnBtn .fxg { font-family: var(--math); font-size: 1.02em; letter-spacing: -.02em; white-space: nowrap; }
#fnBtn .fxg i { font-size: 1.08em; }
#fnBtn.on { color: var(--gold); text-shadow: 0 0 10px rgba(255,216,77,.45); }
/* V(x) = 输入栏：舞台顶上滑出 */
#fnbar { position: absolute; left: 50%; top: .7em; z-index: 6; display: flex; align-items: center; gap: .55em; padding: .35em .5em .35em .9em; font-size: var(--u);
  border-radius: 999px; background: rgba(6,8,13,.82); box-shadow: 0 0 0 1px rgba(255,216,77,.22), 0 8px 30px rgba(0,0,0,.55);
  transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: transform var(--t2) var(--ease), opacity var(--t2) var(--ease); }
#fnbar.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
#fnbar .lhs { font-family: var(--math); font-size: 1.35em; color: var(--gold); white-space: nowrap; }
#fnbar .inp { position: relative; display: block; }
#fnbar .inp::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: rgba(255,216,77,.5); transition: background var(--t1) var(--ease); }
#fnbar .inp.bad::after { background: rgba(255,110,90,.8); }
#fnbar .inp.shake { animation: shk .32s var(--ease); }
@keyframes shk { 20% { transform: translateX(-3px); } 45% { transform: translateX(3px); } 70% { transform: translateX(-1.5px); } 100% { transform: none; } }
#fnIn { width: min(26em, 40vw); background: transparent; border: 0; outline: none; color: #fff; font-family: var(--math); font-size: 1.3em; padding: .1em .1em; caret-color: var(--gold); user-select: text; -webkit-user-select: text; }
#fnbar .inp.bad #fnIn { color: rgba(255,200,190,.85); }
#fnOk { width: 2.1em; height: 2.1em; border-radius: 50%; display: grid; place-items: center; color: var(--gold); border: 1px solid rgba(255,216,77,.4); }
#fnOk:hover { background: rgba(255,216,77,.12); }
#fnOk:disabled { opacity: .3; cursor: default; }
#fnEx { display: flex; gap: .1em; margin-left: .3em; padding-left: .6em; border-left: 1px solid var(--faint); }
#fnEx .fx { padding: .25em .3em; border-radius: 6px; }
#fnEx .fx canvas { display: block; opacity: .55; transition: opacity var(--t1) var(--ease), transform var(--t1) var(--ease); }
#fnEx .fx:hover canvas { opacity: 1; transform: translateY(-1px); }

/* 下沿的控件栏：四个滑块 + 图像抽屉的入口 */
#ctl { display: flex; align-items: center; gap: 1.6em; padding: .35em 1.1em .45em 1.3em; font-size: var(--u); border-top: 1px solid var(--hair); }
#ctl .sl { display: flex; align-items: center; gap: .6em; flex: 1; min-width: 0; max-width: 21em; outline: none; }
#ctl .sym { font-family: var(--math); font-size: 1.45em; width: 1em; text-align: center; color: var(--ink); line-height: 1; cursor: default; }
#ctl #slE .sym { color: var(--egreen); }
#ctl #slG .sym svg { width: .82em; height: .82em; stroke-width: 1.6; vertical-align: -.05em; }
#ctl .val { font-family: var(--math); font-size: 1.12em; min-width: 3.6em; margin-left: .25em; color: rgba(255,255,255,.78); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
#ctl .val .u { font-size: .8em; color: rgba(255,255,255,.5); margin-left: .12em; }
#ctl .val .nm { font-family: var(--zh); font-size: .82em; color: #fff; letter-spacing: .04em; }
#ctl .trk { position: relative; flex: 1; min-width: 4em; height: 26px; cursor: pointer; touch-action: none; }
#ctl .trk i, #ctl .trk b { position: absolute; display: block; pointer-events: none; }
#ctl .trk .rail { left: 0; right: 0; top: 12.5px; height: 1px; background: rgba(255,255,255,.16); }
#ctl .trk .fill { left: 0; right: 0; top: 12px; height: 2px; background: rgba(255,255,255,.55); transform-origin: 0 50%; transform: scaleX(0); }
#ctl #slE .trk .fill { background: var(--egreen); box-shadow: 0 0 6px rgba(92,224,122,.45); }
#ctl .trk .dark { left: 0; width: 100%; top: 4px; height: 18px; transform-origin: 0 50%; opacity: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,.0) 0 3px, rgba(255,255,255,.07) 3px 4px); border-left: 1px solid rgba(255,255,255,.25); transition: opacity var(--t1) var(--ease); }
#ctl .trk .th { left: -6px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.07), 0 0 8px rgba(150,190,255,.45); transition: box-shadow var(--t1) var(--ease), scale var(--t1) var(--ease); }
#ctl #slE .trk .th { background: #E4FFEA; box-shadow: 0 0 0 3px rgba(92,224,122,.12), 0 0 9px rgba(92,224,122,.6); }
#ctl .sl.drag .th, #ctl .sl:focus-visible .th { scale: 1.22; }
#ctl .sl:focus-visible .rail { background: rgba(255,255,255,.3); }
#ctl .trk .mks { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
#ctl .trk .mk { position: absolute; left: -.5px; top: 6px; width: 1px; height: 14px; background: rgba(255,255,255,.4); pointer-events: auto; }
#ctl .trk .mk::after { content: ""; position: absolute; left: -5px; right: -5px; top: 0; bottom: 0; }
#ctl .trk .mk.on { background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.7); }
#ctl .trk .mk.wall { background: rgba(255,216,77,.75); height: 10px; top: 8px; }
#drawerBtn { margin-left: auto; color: rgba(255,255,255,.5); }
#drawerBtn.on { color: #fff; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }

/* 图像抽屉：从舞台下沿升起（舞台同时往上让出这块地方） */
#drawer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; gap: .6em; padding: .5em 1em .4em .7em; font-size: var(--u);
  background: linear-gradient(rgba(0,0,0,.92), #000 30%); border-top: 1px solid rgba(255,255,255,.08); visibility: hidden; opacity: 0; transform: translateY(100%); will-change: transform, opacity; }
#drawer .dtabs { display: flex; flex-direction: column; gap: .15em; justify-content: center; }
#drawer .dt { font-family: var(--math); font-size: 1.12em; padding: .28em .7em; border-radius: 999px; color: rgba(255,255,255,.45); text-align: left; white-space: nowrap; }
#drawer .dt sup { font-size: .62em; }
#drawer .dt:hover { color: rgba(255,255,255,.85); }
#drawer .dt.on { color: #fff; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
#drawer .dplots { flex: 1; display: flex; gap: 1em; min-width: 0; }
#drawer .pp { flex: 0 0 0; min-width: 0; opacity: 0; display: none; position: relative; }
#drawer .pp.on { display: block; flex: 1 1 0; opacity: 1; animation: ppin var(--t2) var(--ease); }
@keyframes ppin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#drawer .pp canvas { position: absolute; left: 0; top: 0; }

/* v8.1：j(x) 一行占满抽屉的横向（和舞台逐像素对齐），开关那一列浮在它左边 */
#drawer .dtabs { position: relative; z-index: 2; padding-right: .4em; background: linear-gradient(90deg, rgba(0,0,0,.85) 70%, rgba(0,0,0,0)); }
#drawer.jonly .pp.j.on, #drawer.stack .pp.j.on { position: absolute; left: 0; right: 0; top: .3em; }
#drawer.jonly .pp.j.on { bottom: .3em; }
#drawer.stack .pp.j.on { height: calc(50% - .5em); }
#drawer.stack .dplots { position: absolute; left: 7.2em; right: 1em; top: 50%; bottom: .4em; }
#drawer.stack .pp.j.on + .pp, #drawer.stack .dplots { min-height: 0; }

/* v8.2：解释卡变小变轻：符号 + 名字（+ 一句话），不要大块的底、不要长引线 */
.ann { max-width: min(17em, 36vw); font-size: clamp(12px, 1.5vh, 15px); }
.ann::before { inset: -.55em -.8em; background: radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,.38) 65%, rgba(0,0,0,0)); }
.ann .hd { gap: .45em; padding: 0 .05em .15em; align-items: baseline; }
.ann:not(.up) .hd { padding-top: .25em; }
.ann .sym { font-size: 1.3em; text-shadow: 0 0 8px var(--c); }
.ann .nm { font-size: .95em; color: rgba(255,255,255,.86); letter-spacing: .03em; }
.ann .hint { font-size: .8em; color: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: .02em .5em; white-space: nowrap; margin-left: .15em; }
.ann .tx { font-size: .92em; line-height: 1.4; color: rgba(255,255,255,.82); padding: .1em .05em 0; }
.ann.up .tx { padding: 0 .05em .15em; }
.ann.up .hd { padding: .1em .05em .15em; }
.ann.bare.up .hd, .ann.bare .hd { padding-top: 0; padding-bottom: .1em; }
#leads path { stroke-width: .9; filter: none; opacity: .8; }

/* v8.2：只剩 j(x) 一张，入口就是它的开关；没有开关那一列 */
#drawer .dtabs { display: none; }
#drawer { padding: 0; }
#drawer.jonly .pp.j.on { top: .35em; bottom: .25em; }

/* v8.3：唯一的图换成“透射率随墙厚”：画布铺满抽屉，图的横轴在画布里对齐下沿墙厚滑块的轨道 */
#drawer.tdonly .pp.td.on { position: absolute; left: 0; right: 0; top: .2em; bottom: .1em; animation: none; }
#ctl .trk .mk.one { background: rgba(255,255,255,.32); height: 8px; top: 9px; }
#drawerBtn .fill { fill: currentColor; stroke: none; }

/* v8.5：右端的图开关拿掉了，五个滑块铺满下沿（不留空），轨道也更长、更好微调 */
#ctl .sl { max-width: none; }

/* ───────── v8.6：iPad 触屏和触控笔 ───────── */
/* 像原生应用一样稳：不滚、不回弹、不下拉刷新、不放大、长按不出菜单、点按不出灰色高亮、文字不被选中 */
html, body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
#app { touch-action: none; height: 100vh; height: 100dvh; width: 100vw; width: 100dvw;
  /* 安全区：刘海、圆角、主屏幕指示条（桌面上这些都是 0） */
  padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
#top { padding-top: calc(.45em + env(safe-area-inset-top, 0px)); }
#ctl { padding-bottom: calc(.45em + env(safe-area-inset-bottom, 0px)); }
input, textarea { touch-action: manipulation; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
/* 函数势的符号键：只在触屏且输入栏聚焦时出现 */
#fnKeys { display: none; }
body.touch.fnfocus #fnKeys { display: flex; gap: 2px; }
#fnKeys button { min-width: 36px; height: 36px; border-radius: 8px; font-family: var(--math); font-size: 1.2em; color: rgba(255,230,160,.9); background: rgba(255,216,77,.08); }
#fnKeys button:active { background: rgba(255,216,77,.22); }

/* 触屏（任何一个指针是“粗”的：iPad 的手指）：命中区域不小于 44 pt（只放大命中区域，图形不变大） */
@media (any-pointer: coarse) {
  .ic, #allmark, #viewBtn, #launch, #reset { width: 44px; height: 44px; }
  #toolPill { width: 44px; height: 44px; margin-top: -22px; }
  .preset { min-height: 44px; min-width: 44px; display: grid; place-items: center; }
  #fnOk, #fnbar .fx { min-height: 44px; min-width: 44px; }
  #fnbar { max-width: calc(100% - 1em); flex-wrap: wrap; justify-content: center; }
  #ctl .trk::before { content: ""; position: absolute; left: -8px; right: -8px; top: -9px; bottom: -9px; }
  #ctl .sym, #ctl .val { min-height: 44px; display: flex; align-items: center; }
  #ctl .sym { justify-content: center; min-width: 44px; }
}
/* 窄的触屏（iPad 竖屏、11 寸横屏）：顶栏的预设另起一行，下沿五个滑块排成两行，读数不被挤掉 */
@media (any-pointer: coarse) and (max-width: 1250px) {
  #top { flex-wrap: wrap; row-gap: 0; }
  #presets { order: 9; flex-basis: 100%; }
  #ctl { flex-wrap: wrap; row-gap: .1em; column-gap: 1.4em; }
  #ctl .sl { flex: 1 1 28%; min-width: 220px; }
}
/* 桌面上很窄的窗口也别挤坏：同样分两行（正常宽度的桌面看不出变化） */
@media (any-pointer: fine) and (max-width: 860px) {
  #top { flex-wrap: wrap; }
  #presets { order: 9; flex-basis: 100%; }
  #ctl { flex-wrap: wrap; }
  #ctl .sl { flex: 1 1 40%; min-width: 200px; }
}
/* v8.7.1：手指、笔按下的那一刻按钮缩一下（只有触屏会加 .press，鼠标不加） */
button.press { transform: scale(.86); transition-duration: .05s; }
#launch.press { background: rgba(59,130,246,.32); }
/* ?diag=1 的自检显示（默认没有） */
#diag { position: fixed; left: calc(4px + env(safe-area-inset-left, 0px)); top: calc(4px + env(safe-area-inset-top, 0px)); right: calc(4px + env(safe-area-inset-right, 0px)); max-height: calc(100% - 8px); overflow: hidden; z-index: 50; font: 14px/1.4 ui-monospace, Menlo, monospace; color: #9f9; background: rgba(0,0,0,.84); padding: 6px 8px; border-radius: 4px; pointer-events: none; white-space: pre-wrap; word-break: break-all; }

/* ───────── v8.7（D 接 E）：手机（扫码打开）。只认 html.phone（rotate.js：粗指针且屏幕短边 < 500），iPad 和桌面都碰不到 ─────────
   手机只有一套横屏版面：竖拿时整页按横屏排好再转 90°（html.rot），真横屏时直接用。版面里的尺寸一律按版面宽高 --LW / --LH 算，不用 vw / vh
   （转着的时候 vw、vh 和媒体查询看到的都是竖屏那一对）。
   版面：上面一行 ▶ ↺ 和七个工具，舞台在左；右边一栏：预设带子在上（手指左右拨）、五个滑块一行一个、相位和全部标注在最下。 */
html.phone { --u: 12px; --rc: clamp(220px, calc(var(--LW) * .37 - 14px), 330px); }
html.phone.rot { --pt: max(16px, env(safe-area-inset-left, 0px)); --pr: max(4px, env(safe-area-inset-top, 0px)); --pb: env(safe-area-inset-right, 0px); --pl: max(14px, env(safe-area-inset-bottom, 0px)); } /* v8.7.1：▶ 离物理下沿（回主屏横条那一侧）至少 14 px */
html.phone:not(.rot) { --pt: max(4px, env(safe-area-inset-top, 0px)); --pr: max(4px, env(safe-area-inset-right, 0px)); --pb: env(safe-area-inset-bottom, 0px); --pl: max(16px, env(safe-area-inset-left, 0px)); } /* v8.7.1：左沿（返回手势）留 16 px */
/* 竖拿：版面宽 = 视口高、版面高 = 视口宽，逆时针转 90°，版面上沿贴着竖拿时的左沿 */
html.rot #app { position: fixed; left: 0; top: 0; width: var(--LW); height: var(--LH); transform-origin: 0 0; transform: translateY(var(--LW)) rotate(-90deg); }
html.phone:not(.rot) #app { width: var(--LW); height: var(--LH); }
html.rot #leads, html.rot .alllabels { width: var(--LW); height: var(--LH); }
html.phone #app { grid-template-columns: auto auto minmax(0, 1fr) var(--rc); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "run tools . pre" "view view view ctl" "view view view opt";
  padding: var(--pt) var(--pr) var(--pb) var(--pl); }
html.phone #top { display: contents; }
html.phone #run { grid-area: run; margin: 0; padding: 0 2px 0 0; gap: 0; }
html.phone #tools { grid-area: tools; gap: 0; }
html.phone .vsep { margin: 0 .1em; }
html.phone #phaseBtn, html.phone #allmark { grid-area: opt; align-self: center; justify-self: end; border-left: 0; }
html.phone #phaseBtn { margin-right: 52px; } html.phone #allmark { margin-right: 4px; }
html.phone #viewWrap { grid-area: view; }
/* 预设：一条带子，手指左右拨（rotate.js 换算过的坐标，main.js 里自己滚；不交给浏览器的原生滚动——转着的时候它的方向靠不住） */
html.phone #presets { grid-area: pre; order: 0; align-self: center; min-width: 0; flex: none; justify-content: flex-start; overflow: hidden; touch-action: none; gap: 0;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 22px), transparent); }
html.phone .preset { flex: none; padding: 0 .3em; }
html.phone #presetMark { bottom: 4px; }
/* v8.7.1：▶ ↺ 是圆的，圆外的四个角点下去不算点。手机上给它们一块看不见的方形命中区，上下再各多 4 px（两个按钮左右挨着，不往左右扩） */
html.phone #launch::after, html.phone #reset::after { content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
/* 滑块：一行一个，读数宽度固定，五条轨道左右对齐；右手拇指够得着 */
html.phone #ctl { grid-area: ctl; flex-direction: column; flex-wrap: nowrap; align-items: stretch; justify-content: center; gap: 0; row-gap: 0; padding: 0 6px 0 2px; border-top: 0; }
html.phone #ctl .sl { flex: 0 0 44px; min-width: 0; width: 100%; max-width: none; gap: .35em; }
html.phone #ctl .val { min-width: 4.4em; width: 4.4em; margin-left: 0; justify-content: flex-end; }
html.phone #ctl .sym { width: 44px; flex: none; }
html.phone .ann { max-width: min(18em, calc(var(--LW) * .5)); font-size: 13px; }
html.phone .lbl { font-size: 12px; }
html.phone #fnIn { width: min(26em, calc(var(--LW) * .42)); }
/* 进页的“转手机”示意（只在竖拿转着显示时出现）：手机轮廓顺时针转 90°，然后淡出；不带字，不挡操作 */
#turnHint { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 60; opacity: 0; transition: opacity .35s var(--ease); }
#turnHint svg { width: 124px; height: 124px; stroke: rgba(255,255,255,.88); stroke-width: 1.6; overflow: visible; }
#turnHint .bg { fill: rgba(0,0,0,.74); stroke: none; }
#turnHint .ph { transition: transform .9s var(--ease) .5s; transform-origin: 0 0; }
#turnHint .ph path { stroke-width: 1.4; }
#turnHint .arc { stroke: var(--gold); stroke-width: 1.6; opacity: 0; transition: opacity .3s var(--ease) .2s; }
#turnHint.go { opacity: 1; }
#turnHint.go .ph { transform: rotate(90deg); }
#turnHint.go .arc { opacity: .85; }
#turnHint.out { opacity: 0; transition: opacity .7s var(--ease); }
/* v8.7：解释卡里的操作提示是给鼠标键盘写的（Shift 细调、双击复原、按回车）；手指和笔用时不显示，卡片只剩符号 + 名字 + 一句话 */
body.touch .ann .hint { display: none !important; }
</style>
<script>
/* v8.7.1：最早的错误收集（主程序之前，ES5 写法）。平时只记不显示；地址带 ?diag=1 时，主程序 4 秒还没跑起来就直接把错误铺在屏幕上 */
(function () {
  var Q = window.__qt = { errs: [], t0: Date.now() };
  Q.err = function (s) { Q.errs.push(((Date.now() - Q.t0) / 1000).toFixed(1) + 's ' + String(s).slice(0, 160)); if (Q.errs.length > 6) Q.errs.shift(); };
  window.addEventListener('error', function (e) { Q.err('error ' + (e.message || (e.target && e.target.tagName) || '?') + (e.lineno ? ' @' + e.lineno + ':' + e.colno : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; Q.err('rejection ' + (r && (r.message || r) || '?')); });
  if (/[?&]diag=1/.test(location.search)) setTimeout(function () {
    if (window.__lab) return;
    var d = document.createElement('pre');
    d.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:99;margin:0;padding:12px;font:16px/1.45 ui-monospace,Menlo,monospace;color:#ff9a9a;background:rgba(0,0,0,.9);white-space:pre-wrap;word-break:break-all';
    d.textContent = 'MAIN NOT RUNNING\n' + navigator.userAgent + '\n' + (Q.errs.join('\n') || 'no error caught');
    document.body.appendChild(d);
  }, 4000);
})();
</script>

</head>
<body>
<div id="app">
  <header id="top">
    <div class="grp" id="run">
      <button id="launch" class="primary" data-ann="launch"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="reset" class="round" data-ann="reset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg></button>
    </div>
    <div class="grp" id="tools">
      <span class="pill" id="toolPill"></span>
      <button class="ic tool" data-tool="hand" data-ann="hand"><svg viewBox="0 0 24 24"><path d="M8.5 12.5V6.2a1.5 1.5 0 0 1 3 0v5M11.5 11V4.8a1.5 1.5 0 0 1 3 0V11M14.5 11V6.3a1.5 1.5 0 0 1 3 0v6.9c0 4-2.4 6.8-6 6.8-2.6 0-4-1.3-5.3-3.4L4.4 13.3a1.4 1.4 0 0 1 2.3-1.5l1.8 2.2"/></svg></button>
      <button class="ic tool" data-tool="pen" data-ann="pen"><svg viewBox="0 0 24 24"><path d="M3 17c3-1 4-9 7-9s3 7 6 7 3-4 5-6"/></svg></button>
      <button class="ic tool" data-tool="rect" data-ann="rect"><svg viewBox="0 0 24 24"><path d="M2 19h5V8h8v11h7"/></svg></button>
      <button class="ic tool" data-tool="erase" data-ann="erase"><svg viewBox="0 0 24 24"><path d="M5 19h14M7 15l7-9 5 4-6 8H9z"/></svg></button>
      <button class="ic" id="fnBtn" data-ann="fn"><span class="fxg"><i>f</i>(<i>x</i>)</span></button>
      <span class="vsep"></span>
      <button class="ic" id="undo" data-ann="undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 11l5 4M4 11h10a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="ic" id="clear" data-ann="clear"><svg viewBox="0 0 24 24"><path d="M3 17h18M8 13l8-7M16 13 8 6"/></svg></button>
    </div>
    <nav id="presets"><span id="presetMark"></span></nav>
    <button id="phaseBtn" class="ic" data-ann="phase"><span class="wheel"></span></button>
    <button id="allmark" data-ann="allmark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.6" class="fill"/></svg></button>
  </header>
  <section id="viewWrap">
    <canvas id="view"></canvas>
    <div id="readR" class="read hide" data-ann="R"><i class="lab">R</i><span class="rel">=</span><span class="num" id="rRnum"></span></div>
    <button id="viewBtn" data-ann="view"><svg class="cube" viewBox="0 0 24 24"><path d="M12 3.2 19.6 7.4v9.2L12 20.8 4.4 16.6V7.4zM4.4 7.4 12 11.6l7.6-4.2M12 11.6v9.2"/></svg><svg class="flat" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/><path d="M5 12h14" stroke-dasharray="2 2.4"/></svg></button>
    <div id="fnbar"><span class="lhs" data-ann="fnlhs"><i>V</i>(<i>x</i>) =</span><span class="inp"><input id="fnIn" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="text" enterkeyhint="done" data-ann="fnin"></span><span id="fnKeys"></span><button id="fnOk" data-ann="fnok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span id="fnEx"></span></div>
    <div id="readT" class="read" data-ann="T"><i class="lab">T</i><span class="rel" id="rTrel">≈</span><span class="num" id="rTnum"></span><span class="mix" id="rMix"><b id="rMixT"></b></span></div>
  </section>
  <footer id="ctl">
    <div class="sl" id="slE"><span class="sym" data-ann="sE"><i>E</i></span><div class="trk"></div><span class="val" data-ann="sE"></span></div>
    <div class="sl" id="slM"><span class="sym" data-ann="sM"><i>m</i></span><div class="trk"></div><span class="val" data-ann="sM"></span></div>
    <div class="sl" id="slD"><span class="sym" data-ann="sD"><i>d</i></span><div class="trk"></div><span class="val" data-ann="sD"></span></div>
    <div class="sl" id="slS"><span class="sym" data-ann="sS"><i>σ</i></span><div class="trk"></div><span class="val" data-ann="sS"></span></div>
    <div class="sl" id="slG"><span class="sym" data-ann="sG"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.8"/><path d="M14.8 14.8 20 20M8 10.5h5M10.5 8v5"/></svg></span><div class="trk"></div><span class="val" data-ann="sG"></span></div>
  </footer>
